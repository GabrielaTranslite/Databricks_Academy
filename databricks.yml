# Databricks Asset Bundle for the ENTSO-E / data-center project.
#
# One bundle, two targets:
#   dev  -> Databricks Free Edition. Bronze is produced by the synthetic generator
#           (no internet egress, no Event Hub needed).
#   prod -> Azure Databricks. Bronze is produced from the real ENTSO-E API
#           (Auto Loader) and the Azure Event Hub stream.
#
# This bundle deploys:
#   1. silver_pipeline    (classic Job, Lab 4)   -- imperative notebooks + MERGE, per target.
#   2. entsoe_silver_ldp  (declarative pipeline)  -- Lakeflow, Lab 7 version: silver + DQX
#                                                    quality checks (valid / quarantine split) + gold.
#   3. tests_job          (Job, Lab 7)            -- pytest unit tests run headless on serverless.
#   4. gold_dim_job       (Job, Lab 7)            -- runs the pipeline, then builds the dim_date
#                                                    calendar dimension (generated from a date range).
# silver_pipeline and entsoe_silver_ldp are kept side by side as the "classic vs declarative" comparison.
#
# Deploy dev:      databricks bundle deploy -t dev
# Run unit tests:  databricks bundle run tests_job          -t dev
# Run pipeline:    databricks bundle run entsoe_silver_ldp  -t dev
# Run gold + dim:  databricks bundle run gold_dim_job       -t dev
# Deploy prod:     databricks bundle deploy -t prod

bundle:
  name: entsoe_silver

# Defaults. Each target overrides the values it needs.
variables:
  catalog:
    description: Unity Catalog to read/write.
    default: workspace
  bronze_schema:
    description: Bronze schema.
    default: bronze
  silver_schema:
    description: Silver schema.
    default: silver
  gold_schema:
    description: Gold schema.
    default: gold
  dim_date_start:
    description: dim_date range start (inclusive), passed to the dim_date notebook.
    default: "2026-06-01"
  dim_date_end:
    description: dim_date range end (inclusive), passed to the dim_date notebook.
    default: "2026-12-31"
  warehouse_id:
    description: SQL warehouse id for the DQ dashboard refresh (set per target once the dashboard is wired).
    default: ""
sync:
  exclude:
    - "*.dbc"
    - "*.pdf"
    - ".venv"
    - "**/__pycache__"

# ===========================================================================
# Lab 7 -- declarative pipeline (Lakeflow Spark Declarative Pipelines).
# Defined ONCE at top level: the definition is identical for dev and prod,
# only the ${var.*} values differ (resolved per target).
# ldp_pipeline.py is a plain .py source file >> `file:` (not `notebook:`).
# The pipeline now runs the DQX quality suite in silver, so it needs the
# databricks-labs-dqx dependency and the silver_transformations helper module.
# ===========================================================================
resources:
  pipelines:
    entsoe_silver_ldp:
      name: entsoe-silver-ldp-${bundle.target}   # entsoe-silver-ldp-dev / -prod
      catalog: ${var.catalog}                    # target catalog (workspace on dev, dbr_dev on prod)
      schema: ${var.silver_schema}               # where the pipeline writes its tables
      serverless: true

      libraries:
        - file:
            path: ./Lab7/ldp_pipeline.py            # Lab 7 version: silver + DQX + gold (was ./Lab5/...)
        - file:
            path: ./Lab7/silver_transformations.py  # helper module imported by the pipeline (clean_prices / clean_sensor)

      # Pipeline environment (serverless): pip dependencies installed for the pipeline.
      environment:
        dependencies:
          - databricks-labs-dqx==0.16.0             # pinned for reproducibility (bump if `pip show databricks-labs-dqx` shows newer)

      # Becomes spark.conf entries, read by spark.conf.get(...) in the pipeline file.
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}

targets:

  # ===========================================================================
  # DEV  --  Free Edition, generator-seeded bronze
  # ===========================================================================
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8697dee0-e1e6.cloud.databricks.com
    variables:
      catalog: workspace
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      warehouse_id: ba25c68220f8a0ce
    resources:
      dashboards:
        dq_dashboard:
          display_name: "ENTSO-E Data Quality"
          file_path: ./Lab7/Data_Quality.lvdash.json
          warehouse_id: ${var.warehouse_id}
          dataset_catalog: ${var.catalog}
      jobs:
        tests_job:
          name: entsoe-unit-tests-dev
          tasks:
            - task_key: unit_tests
              spark_python_task:
                python_file: ./Lab7/run_tests.py
              environment_key: test_env
          environments:
            - environment_key: test_env
              spec:
                environment_version: "3"
                dependencies:
                  - pytest

        # --- Lab 7: run the declarative pipeline (silver + DQX + gold), then build dim_date ---
        gold_dim_job:
          name: entsoe-gold-dim-dev
          tasks:
            # Seed bronze on Free Edition with the synthetic generator.
            - task_key: generate_bronze
              # Free Edition compute can be slow to start; retry a stuck or failed start.
              max_retries: 2
              min_retry_interval_millis: 120000   # wait 2 min between retries
              retry_on_timeout: true
              timeout_seconds: 1800               # give up after 30 min waiting, then retry
              notebook_task:
                notebook_path: ./Lab4/generate_bronze_sample.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  n_days: "14"
                  seed: "42"
            # Silver + DQX + gold, all inside the declarative pipeline.
            - task_key: run_pipeline
              depends_on:
                - task_key: generate_bronze
              # dev bronze is regenerated with OVERWRITE each run, which breaks streaming reads;
              # full refresh gives the pipeline a fresh checkpoint so it reprocesses cleanly.
              timeout_seconds: 3600
              pipeline_task:
                pipeline_id: ${resources.pipelines.entsoe_silver_ldp.id}
                full_refresh: true
            # dim_date is generated from a date range (no fact scan), so it only needs the gold schema to exist.
            - task_key: build_dim_date
              depends_on:
                - task_key: run_pipeline
              notebook_task:
                notebook_path: ./Lab7/06_gold_dim_date.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  gold_schema: ${var.gold_schema}
                  silver_schema: ${var.silver_schema}
                  dim_date_start: ${var.dim_date_start}
                  dim_date_end: ${var.dim_date_end}
            - task_key: refresh_dashboard
              depends_on:
                - task_key: build_dim_date
              dashboard_task:
                dashboard_id: ${resources.dashboards.dq_dashboard.id}
                warehouse_id: ${var.warehouse_id}

        silver_pipeline:
          name: entsoe-silver-pipeline-dev
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00
            timezone_id: Europe/Warsaw
            pause_status: PAUSED
          tasks:

            # --- Bronze: synthetic generator (replaces API + Event Hub on Free Edition) ---
            - task_key: generate_bronze
              notebook_task:
                notebook_path: ./Lab4/generate_bronze_sample.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  n_days: "14"
                  seed: "42"

            # --- Silver ---
            - task_key: silver_prices
              depends_on:
                - task_key: generate_bronze
              notebook_task:
                notebook_path: ./Lab4/03_silver_entsoe.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"

            - task_key: silver_sensor
              depends_on:
                - task_key: generate_bronze
              notebook_task:
                notebook_path: ./Lab4/04_silver_sensor_data.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"

            - task_key: silver_dim
              depends_on:
                - task_key: generate_bronze
              notebook_task:
                notebook_path: ./Lab4/05_silver_dim_datacenter.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"

  # ===========================================================================
  # PROD  --  Azure Databricks, real ENTSO-E API + Azure Event Hub
  # ===========================================================================
  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/gabrielajaniszews786@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      bronze_schema: gabrielajaniszews786_bronze
      silver_schema: gabrielajaniszews786_silver
      gold_schema: gabrielajaniszews786_gold
    resources:
      jobs:
        # --- Lab 7: run the declarative pipeline (silver + DQX + gold), then build dim_date ---
        # Bronze on prod is produced by the ingestion tasks in silver_pipeline (fetch / autoloader /
        # event hub), so this job assumes bronze is already populated and just runs pipeline + dim_date.
        gold_dim_job:
          name: entsoe-gold-dim-prod
          tasks:
            - task_key: run_pipeline
              pipeline_task:
                pipeline_id: ${resources.pipelines.entsoe_silver_ldp.id}
            - task_key: build_dim_date
              depends_on:
                - task_key: run_pipeline
              notebook_task:
                notebook_path: ./Lab7/06_gold_dim_date.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  gold_schema: ${var.gold_schema}
                  silver_schema: ${var.silver_schema}
                  dim_date_start: ${var.dim_date_start}
                  dim_date_end: ${var.dim_date_end}

        silver_pipeline:
          name: entsoe-silver-pipeline-prod
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00
            pause_status: PAUSED
            timezone_id: Europe/Warsaw
          tasks:

            # --- Bronze: prices from the ENTSO-E API, landed then Auto Loaded ---
            - task_key: fetch_prices
              notebook_task:
                notebook_path: ./Lab3/01_fetch_entsoe_prices_lab3.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  n_days: "30"
                  bidding_zone: "PL,DE_LU,FR,ES,CZ,SK,LT,PT"
                  secret_scope: default2
                  secret_key: gabriela-entsoe-token

            - task_key: autoloader_prices
              depends_on:
                - task_key: fetch_prices
              notebook_task:
                notebook_path: ./Lab3/02_autoloader_bronze_lab3.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}

            # --- Bronze: sensor stream from Azure Event Hub ---
            # NOTE: 03_fetch_sensor_streaming must be parameterized (widgets:
            #       eh_namespace, eh_name, secret_scope, secret_key) for these to apply.
            - task_key: ingest_sensor
              notebook_task:
                notebook_path: ./Lab3/03_fetch_sensor_streaming_lab3.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  eh_namespace: evhpl24databricks
                  eh_name: gabrielajaniszews786_eventhub
                  secret_scope: default2
                  secret_key: eventhub-con-str-gabriela

            # --- Silver ---
            - task_key: silver_prices
              depends_on:
                - task_key: autoloader_prices
              notebook_task:
                notebook_path: ./Lab4/03_silver_entsoe.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"

            - task_key: silver_sensor
              depends_on:
                - task_key: ingest_sensor
              notebook_task:
                notebook_path: ./Lab4/04_silver_sensor_data.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"

            - task_key: silver_dim
              depends_on:
                - task_key: ingest_sensor
              notebook_task:
                notebook_path: ./Lab4/05_silver_dim_datacenter.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  silver_schema: ${var.silver_schema}
                  run_checks: "false"
